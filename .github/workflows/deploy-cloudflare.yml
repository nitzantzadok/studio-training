# פריסה לשרת המשותף — מהדפדפן, בלי טרמינל.
#
# פעם אחת: Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   אסימון מחשבון Cloudflare (חינמי)
#   CLOUDFLARE_ACCOUNT_ID  מזהה החשבון, מתוך כתובת לוח הבקרה
#
# ואז: Actions → "פריסה לשרת המשותף" → Run workflow.
# מאותו רגע כל שינוי שנדחף ל-main מתפרסם לבד.
name: פריסה לשרת המשותף

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # הבדיקה כאן ולא בתנאי של המשימה: הקשר secrets אינו זמין ב-if ברמת
      # המשימה, וניסיון להשתמש בו מפיל את כל התהליך עוד לפני שהוא מתחיל
      - name: יש אסימון?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::חסר CLOUDFLARE_API_TOKEN. מוסיפים אותו ב-Settings → Secrets and variables → Actions, ומריצים שוב."
            exit 1
          fi

      # שגיאת האימות של wrangler מגיעה רק בשלב מאוחר ובניסוח טכני. כאן היא
      # נבדקת מראש, והתשובה אומרת בדיוק מה לא בסדר ומה לעשות.
      - name: האסימון תקף?
        run: |
          RESP="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          if ! printf '%s' "$RESP" | grep -q '"success":true'; then
            echo "::error::Cloudflare אינו מזהה את האסימון. כמעט תמיד הועתק ערך שגוי (מזהה האסימון במקום הערך עצמו) או שנכנס רווח/שורה נוספת. יוצרים אסימון חדש, מעתיקים מהתיבה שמופיעה מיד אחרי Create Token, ומעדכנים את הסוד."
            echo "תשובת Cloudflare: $RESP"
            exit 1
          fi
          echo "האסימון תקף."

          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ACC="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" || true)"
            if ! printf '%s' "$ACC" | grep -q '"success":true'; then
              echo "::error::האסימון תקף אבל אין לו גישה לחשבון שהוגדר ב-CLOUDFLARE_ACCOUNT_ID. בעמוד יצירת האסימון, תחת Account Resources, צריך לכלול את החשבון הזה."
              exit 1
            fi
            echo "הגישה לחשבון תקינה."
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: בנייה
        run: node build.mjs

      - name: בדיקות
        run: node --test tests/*.test.js

      - name: מסד D1 — נוצר רק אם אינו קיים
        run: |
          set -e
          if grep -q PLACEHOLDER wrangler.toml; then
            OUT="$(npx --yes wrangler@4 d1 create studio-training 2>&1 || true)"
            ID="$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)"
            if [ -z "$ID" ]; then
              ID="$(npx --yes wrangler@4 d1 list --json 2>/dev/null \
                | tr ',' '\n' | grep -A1 '"name":"studio-training"' \
                | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)"
            fi
            if [ -z "$ID" ]; then echo "לא הצלחנו ליצור או למצוא את המסד:"; echo "$OUT"; exit 1; fi
            sed -i "s|database_id = \".*\"|database_id = \"$ID\"|" wrangler.toml
            echo "מסד: $ID"
          fi

      - name: פריסה
        run: npx --yes wrangler@4 deploy
